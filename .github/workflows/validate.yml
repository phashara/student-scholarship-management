name: Validate scholarship app

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install --legacy-peer-deps
      - run: node --test tests/*.cjs
      - run: npm run lint
      - run: npm run build
